<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030d07"/>
      <stop offset="50%" stop-color="#0a2618"/>
      <stop offset="100%" stop-color="#020804"/>
    </linearGradient>
    <linearGradient id="gold4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a0"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#91722e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bg4)"/>
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="url(#gold4)" stroke-width="1.5" opacity="0.6"/>
  <rect x="35" y="35" width="530" height="680" fill="none" stroke="url(#gold4)" stroke-width="0.7" opacity="0.3"/>
  <!-- The Sacred Nikah Parchment & Quill -->
  <g transform="translate(150, 160)">
    <!-- Parchment Certificate in Emerald & Gold -->
    <rect x="0" y="0" width="300" height="340" rx="4" fill="#04140b" stroke="url(#gold4)" stroke-width="2"/>
    <rect x="12" y="12" width="276" height="316" fill="none" stroke="url(#gold4)" stroke-width="0.8" stroke-dasharray="3 3"/>
    <!-- Top Bismillah / Illumination Ornament -->
    <path d="M 50,40 Q 150,15 250,40" fill="none" stroke="url(#gold4)" stroke-width="1.5"/>
    <circle cx="150" cy="45" r="14" fill="none" stroke="url(#gold4)" stroke-width="1.2"/>
    <circle cx="150" cy="45" r="4" fill="url(#gold4)"/>
    <!-- Flowing Arabic / Urdu Calligraphic Lines Placeholder -->
    <path d="M 60,95 Q 150,85 240,95" stroke="url(#gold4)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 70,135 Q 150,125 230,135" stroke="url(#gold4)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 60,175 Q 150,165 240,175" stroke="url(#gold4)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- Golden Wax Seal on Parchment -->
    <circle cx="150" cy="245" r="28" fill="#801000" stroke="url(#gold4)" stroke-width="2"/>
    <circle cx="150" cy="245" r="22" fill="none" stroke="url(#gold4)" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="150" y="253" text-anchor="middle" font-family="'Cinzel', serif" font-size="18" font-weight="bold" fill="#f5e0a0">N</text>
    <!-- Ribbon ends -->
    <path d="M 140,270 L 130,310 L 142,302 L 148,310 Z" fill="#801000" stroke="url(#gold4)" stroke-width="0.5"/>
    <path d="M 160,270 L 152,310 L 158,302 L 170,310 Z" fill="#801000" stroke="url(#gold4)" stroke-width="0.5"/>
  </g>
  <!-- Labels -->
  <text x="300" y="600" text-anchor="middle" font-family="'Cinzel', serif" font-size="20" letter-spacing="6" fill="#f5e0a0">THE SACRED NIKAH</text>
  <text x="300" y="630" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-style="italic" font-size="16" fill="#c5a059">Bound by prayer, certified with lifelong devotion</text>
</svg>
