<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04120a"/>
      <stop offset="50%" stop-color="#0a2618"/>
      <stop offset="100%" stop-color="#020905"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a0"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#91722e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#04120a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bg1)"/>
  <circle cx="300" cy="340" r="220" fill="url(#glow1)"/>
  <!-- Decorative Arch Frame -->
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="url(#gold1)" stroke-width="1.5" opacity="0.6"/>
  <rect x="35" y="35" width="530" height="680" fill="none" stroke="url(#gold1)" stroke-width="0.7" opacity="0.3"/>
  <!-- Mughal Arch Top -->
  <path d="M 60,180 C 140,180 200,90 300,60 C 400,90 460,180 540,180" fill="none" stroke="url(#gold1)" stroke-width="2"/>
  <!-- Jali star in arch apex -->
  <circle cx="300" cy="110" r="14" fill="none" stroke="url(#gold1)" stroke-width="1.2"/>
  <polygon points="300,98 304,106 312,110 304,114 300,122 296,114 288,110 296,106" fill="url(#gold1)"/>
  <!-- Central Emblem: Intertwined Rings & Roses -->
  <circle cx="265" cy="340" r="75" fill="none" stroke="url(#gold1)" stroke-width="5" opacity="0.85"/>
  <circle cx="335" cy="340" r="75" fill="none" stroke="url(#gold1)" stroke-width="5" opacity="0.85"/>
  <!-- Brilliant Diamond Sparkle -->
  <polygon points="335,245 350,265 342,275 328,275 320,265" fill="url(#gold1)" stroke="#fff" stroke-width="1"/>
  <!-- Radiating light rays -->
  <line x1="335" y1="230" x2="335" y2="215" stroke="#f5e0a0" stroke-width="2"/>
  <line x1="355" y1="240" x2="368" y2="230" stroke="#f5e0a0" stroke-width="1.5"/>
  <line x1="315" y1="240" x2="302" y2="230" stroke="#f5e0a0" stroke-width="1.5"/>
  <!-- Floral Garlands along bottom -->
  <path d="M 120,480 Q 300,560 480,480" fill="none" stroke="url(#gold1)" stroke-width="1.5" stroke-dasharray="3 5"/>
  <circle cx="210" cy="510" r="8" fill="url(#gold1)" opacity="0.7"/>
  <circle cx="300" cy="525" r="12" fill="url(#gold1)" opacity="0.9"/>
  <circle cx="390" cy="510" r="8" fill="url(#gold1)" opacity="0.7"/>
  <!-- Text Label -->
  <text x="300" y="600" text-anchor="middle" font-family="'Cinzel', serif" font-size="20" letter-spacing="6" fill="#f5e0a0">THE PROMISE</text>
  <text x="300" y="630" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-style="italic" font-size="16" fill="#c5a059">A journey of two souls destined together</text>
</svg>
