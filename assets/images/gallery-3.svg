<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020804"/>
      <stop offset="50%" stop-color="#062114"/>
      <stop offset="100%" stop-color="#010603"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a0"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#91722e"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#e6ca65" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020804" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bg3)"/>
  <circle cx="300" cy="270" r="180" fill="url(#glow3)"/>
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="url(#gold3)" stroke-width="1.5" opacity="0.6"/>
  <rect x="35" y="35" width="530" height="680" fill="none" stroke="url(#gold3)" stroke-width="0.7" opacity="0.3"/>
  <!-- Grand Mughal Pavilion & Arch Architecture -->
  <path d="M 120,440 L 120,250 C 120,130 200,80 300,50 C 400,80 480,130 480,250 L 480,440" fill="none" stroke="url(#gold3)" stroke-width="2.5"/>
  <path d="M 140,440 L 140,260 C 140,160 210,110 300,90 C 390,110 460,160 460,260 L 460,440" fill="none" stroke="url(#gold3)" stroke-width="1" stroke-dasharray="2 3" opacity="0.7"/>
  <!-- Cusped Arch Multi-foil -->
  <path d="M 180,440 L 180,310 C 180,240 210,210 240,240 C 270,180 330,180 360,240 C 390,210 420,240 420,310 L 420,440" fill="none" stroke="url(#gold3)" stroke-width="1.8"/>
  <!-- Chhatri Dome Finial -->
  <circle cx="300" cy="40" r="4" fill="url(#gold3)"/>
  <line x1="300" y1="44" x2="300" y2="52" stroke="url(#gold3)" stroke-width="2"/>
  <!-- Crescent Moon & Stars in Arch -->
  <path d="M 315,150 A 20 20 0 1 0 290,175 A 15 15 0 1 1 315,150 Z" fill="url(#gold3)" opacity="0.8"/>
  <!-- Couple Silhouette in the Arch -->
  <ellipse cx="270" cy="350" rx="14" ry="16" fill="url(#gold3)" opacity="0.7"/>
  <path d="M 252,440 C 250,380 260,370 270,370 C 280,370 290,380 288,440 Z" fill="url(#gold3)" opacity="0.7"/>
  <!-- Bride veil draped silhouette -->
  <ellipse cx="320" cy="358" rx="13" ry="15" fill="url(#gold3)" opacity="0.7"/>
  <path d="M 302,440 C 300,385 310,375 320,375 C 330,375 345,395 342,440 Z" fill="url(#gold3)" opacity="0.7"/>
  <path d="M 320,358 C 340,365 355,400 350,440" fill="none" stroke="url(#gold3)" stroke-width="1.5" stroke-dasharray="2 3"/>
  <!-- Labels -->
  <text x="300" y="600" text-anchor="middle" font-family="'Cinzel', serif" font-size="20" letter-spacing="6" fill="#f5e0a0">TWILIGHT IN LAHORE</text>
  <text x="300" y="630" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-style="italic" font-size="16" fill="#c5a059">Underneath historic marble arches and timeless starlight</text>
</svg>
