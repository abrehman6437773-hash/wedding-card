<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#e6ca65" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#91722e" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Mughal Jali Star and Octagram Lattice Pattern -->
  <g fill="none" stroke="url(#goldStroke)" stroke-width="0.8">
    <!-- Center 8-pointed star -->
    <polygon points="60,25 70,45 95,45 76,60 85,85 60,70 35,85 44,60 25,45 50,45" />
    <circle cx="60" cy="60" r="10" stroke-width="0.6" stroke-opacity="0.4"/>
    <circle cx="60" cy="60" r="2" fill="#c5a059" fill-opacity="0.5"/>

    <!-- Intersecting arch lines -->
    <path d="M 0,0 Q 30,30 60,0 Q 90,30 120,0" />
    <path d="M 0,120 Q 30,90 60,120 Q 90,90 120,120" />
    <path d="M 0,0 Q 30,30 0,60 Q 30,90 0,120" />
    <path d="M 120,0 Q 90,30 120,60 Q 90,90 120,120" />

    <!-- Corner stars -->
    <polygon points="0,15 10,25 0,35" />
    <polygon points="120,15 110,25 120,35" />
    <polygon points="0,85 10,95 0,105" />
    <polygon points="120,85 110,95 120,105" />

    <!-- Rosette accents -->
    <circle cx="0" cy="60" r="4" stroke-opacity="0.5"/>
    <circle cx="120" cy="60" r="4" stroke-opacity="0.5"/>
    <circle cx="60" cy="0" r="4" stroke-opacity="0.5"/>
    <circle cx="60" cy="120" r="4" stroke-opacity="0.5"/>
  </g>
</svg>
