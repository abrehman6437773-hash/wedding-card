<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a0"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#91722e"/>
    </linearGradient>
  </defs>
  <!-- Mehndi / Henna Floral Mandala Icon -->
  <circle cx="32" cy="32" r="6" fill="url(#goldIcon)" opacity="0.9"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="url(#goldIcon)" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#goldIcon)" stroke-width="1.2"/>
  <!-- Petals -->
  <path d="M32,12 C28,18 28,24 32,24 C36,24 36,18 32,12 Z" fill="url(#goldIcon)" opacity="0.8"/>
  <path d="M32,52 C28,46 28,40 32,40 C36,40 36,46 32,52 Z" fill="url(#goldIcon)" opacity="0.8"/>
  <path d="M12,32 C18,28 24,28 24,32 C24,36 18,36 12,32 Z" fill="url(#goldIcon)" opacity="0.8"/>
  <path d="M52,32 C46,28 40,28 40,32 C40,36 46,36 52,32 Z" fill="url(#goldIcon)" opacity="0.8"/>
  <!-- Diagonal vines -->
  <path d="M18,18 Q25,25 22,30" stroke="url(#goldIcon)" stroke-width="1.2" fill="none"/>
  <path d="M46,18 Q39,25 42,30" stroke="url(#goldIcon)" stroke-width="1.2" fill="none"/>
  <path d="M18,46 Q25,39 22,34" stroke="url(#goldIcon)" stroke-width="1.2" fill="none"/>
  <path d="M46,46 Q39,39 42,34" stroke="url(#goldIcon)" stroke-width="1.2" fill="none"/>
  <!-- Leaves -->
  <circle cx="16" cy="16" r="2" fill="url(#goldIcon)"/>
  <circle cx="48" cy="16" r="2" fill="url(#goldIcon)"/>
  <circle cx="16" cy="48" r="2" fill="url(#goldIcon)"/>
  <circle cx="48" cy="48" r="2" fill="url(#goldIcon)"/>
</svg>
