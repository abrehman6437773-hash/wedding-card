  <circle cx="16" cy="27" r="4.5" fill="url(#goldGarland)" opacity="0.9"/>
  <circle cx="26" cy="34" r="5" fill="url(#goldGarland)" opacity="0.9"/>
  <circle cx="32" cy="36" r="6" fill="#f5e0a0"/>
  <circle cx="32" cy="36" r="3" fill="#91722e"/>
  <circle cx="38" cy="34" r="5" fill="url(#goldGarland)" opacity="0.9"/>
  <circle cx="48" cy="27" r="4.5" fill="url(#goldGarland)" opacity="0.9"/>
  <!-- Mughal Crown / Kalgi on Top -->
  <path d="M26,18 L32,10 L38,18 Z" fill="url(#goldGarland)"/>
  <circle cx="32" cy="8" r="2" fill="#ffffff"/>
  <!-- Tassels -->
  <line x1="32" y1="42" x2="32" y2="54" stroke="url(#goldGarland)" stroke-width="1.5" stroke-dasharray="1 2"/>
  <circle cx="32" cy="56" r="2.5" fill="url(#goldGarland)"/>
